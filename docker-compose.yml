name: wordpress-plugin-designinserter

services:
  db:
    image: mysql:8.0
    container_name: designinserter-db
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3316}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-designinserter}
    volumes:
      - db_data:/var/lib/mysql
      - ./.docker/mysql/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-rootpass}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - designinserter-net

  wordpress:
    build:
      context: ./.docker/wordpress
    container_name: designinserter-wp
    restart: unless-stopped
    ports:
      - "${WP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-designinserter}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_HOST: db
      WP_HOME: ${WP_HOME:-http://localhost:8080}
      WP_TITLE: ${WP_TITLE:-Design Inserter Dev}
      WP_LOCALE: ${WP_LOCALE:-ja}
      WP_THEME: ${WP_THEME:-designinserter-dev}
      WP_AUTO_INSTALL: ${WP_AUTO_INSTALL:-false}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASS: ${WP_ADMIN_PASS:-admin}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
      WP_PLUGINS: ${WP_PLUGINS:-}
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes:/var/www/html/wp-content/themes
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - wp_uploads:/var/www/html/wp-content/uploads
      - ./.docker/conf/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./.docker/conf/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini:ro
      - ./.docker/conf/mysql-client.cnf:/etc/mysql/mariadb.conf.d/99-docker.cnf:ro
    networks:
      - designinserter-net

volumes:
  db_data:
  wp_core:
  wp_uploads:

networks:
  designinserter-net:
    driver: bridge
