name: musashi

services:
  musashi-db:
    image: mysql:8.0
    container_name: musashi-db
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3316}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-musashi_jp}
    volumes:
      - db_data:/var/lib/mysql
      - ./.docker/mysql/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-rootpass}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - musashi-net

  musashi-wp-jp:
    build:
      context: ./.docker/wordpress
    container_name: musashi-wp-jp
    restart: unless-stopped
    ports:
      - "${WP_JP_PORT:-8080}:80"
    depends_on:
      musashi-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_NAME: ${JP_DB_NAME:-musashi_jp}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_HOST: musashi-db
      WP_HOME: ${JP_WP_HOME:-http://localhost:8080}
      WP_TITLE: ${JP_WP_TITLE:-武蔵塗料}
      WP_LOCALE: ${JP_WP_LOCALE:-ja}
      WP_THEME: ${JP_WP_THEME:-muashi}
      WP_ADMIN_USER: ${JP_WP_ADMIN_USER:-admin}
      WP_ADMIN_PASS: ${JP_WP_ADMIN_PASS:-admin}
      WP_ADMIN_EMAIL: ${JP_WP_ADMIN_EMAIL:-admin@example.com}
      WP_PLUGINS: ${WP_PLUGINS:-}
      SMTP_HOST: ${SMTP_HOST:-musashi-mail}
      SMTP_PORT: ${SMTP_PORT:-1025}
    volumes:
      - wp_core_jp:/var/www/html
      - ./wp-content/themes/muashi:/var/www/html/wp-content/themes/muashi
      - ./wp-content/plugins/musashi-inquiry-approval:/var/www/html/wp-content/plugins/musashi-inquiry-approval
      - wp_uploads_jp:/var/www/html/wp-content/uploads
      - ./.docker/conf/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./.docker/conf/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini:ro
      - ./.docker/conf/mysql-client.cnf:/etc/mysql/mariadb.conf.d/99-docker.cnf:ro
    networks:
      - musashi-net

  musashi-wp-en:
    build:
      context: ./.docker/wordpress
    container_name: musashi-wp-en
    restart: unless-stopped
    ports:
      - "${WP_EN_PORT:-8081}:80"
    depends_on:
      musashi-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_NAME: ${EN_DB_NAME:-musashi_en}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_HOST: musashi-db
      WP_HOME: ${EN_WP_HOME:-http://localhost:8081}
      WP_TITLE: ${EN_WP_TITLE:-MusashiPaint EN}
      WP_LOCALE: ${EN_WP_LOCALE:-en_US}
      WP_THEME: ${EN_WP_THEME:-muashi-en}
      WP_ADMIN_USER: ${EN_WP_ADMIN_USER:-admin}
      WP_ADMIN_PASS: ${EN_WP_ADMIN_PASS:-admin}
      WP_ADMIN_EMAIL: ${EN_WP_ADMIN_EMAIL:-admin@example.com}
      WP_PLUGINS: ${WP_PLUGINS:-}
      SMTP_HOST: ${SMTP_HOST:-musashi-mail}
      SMTP_PORT: ${SMTP_PORT:-1025}
    volumes:
      - wp_core_en:/var/www/html
      - ./wp-content/themes/muashi-en:/var/www/html/wp-content/themes/muashi-en
      - ./wp-content/plugins/musashi-inquiry-approval:/var/www/html/wp-content/plugins/musashi-inquiry-approval
      - wp_uploads_en:/var/www/html/wp-content/uploads
      - ./.docker/conf/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./.docker/conf/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini:ro
      - ./.docker/conf/mysql-client.cnf:/etc/mysql/mariadb.conf.d/99-docker.cnf:ro
    networks:
      - musashi-net

  musashi-mail:
    image: axllent/mailpit:v1.21
    container_name: musashi-mail
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - musashi-net

volumes:
  db_data:
  wp_core_jp:
  wp_core_en:
  wp_uploads_jp:
  wp_uploads_en:

networks:
  musashi-net:
    driver: bridge
