version: '3'

vars:
  # Local by Flywheel パス（バージョン更新時に変更）
  LOCAL_PHP: C:/Users/suker/AppData/Roaming/Local/lightning-services/php-8.2.27+1/bin/win64/php.exe
  LOCAL_PHPINI: C:/Users/suker/AppData/Roaming/Local/run/41iJdtYte/conf/php/php.ini
  LOCAL_MYSQL: C:/Users/suker/AppData/Roaming/Local/lightning-services/mysql-8.0.35+4/bin/win64/bin/mysql.exe
  LOCAL_MYSQLDUMP: C:/Users/suker/AppData/Roaming/Local/lightning-services/mysql-8.0.35+4/bin/win64/bin/mysqldump.exe
  LOCAL_MYSQL_PORT: "10011"

  # URL
  STAGING_URL: https://musashipaint.xsrv.jp
  LOCAL_URL: http://localhost:10010

  # SSH（~/.ssh/config の Host musashi を利用）
  SSH_HOST: musashi
  STAGING_PATH: ~/musashipaint.xsrv.jp/public_html
  STAGING_SSH_FULL: musashipaint@sv16698.xserver.jp

  # ステージング DB
  STAGING_DB_USER: musashipaint_wp1
  STAGING_DB_PASS: j4jtxjtv5f
  STAGING_DB_NAME: musashipaint_wp1

  # rsync 共通除外
  RSYNC_EXCLUDES: >-
    --exclude='node_modules/'
    --exclude='.git/'
    --exclude='.sass-cache/'
    --exclude='cache/'
    --exclude='upgrade/'
    --exclude='ai1wm-backups/'
    --exclude='wpvividbackups/'
    --exclude='wpvivid_staging/'
    --exclude='debug.log'
    --exclude='object-cache.php'
    --exclude='advanced-cache.php'
    --exclude='db.php'

  # Docker
  DOCKER_ENV_FILE:
    sh: |
      if [ -f .env ]; then
        echo .env
      elif [ -f .env.docker ]; then
        echo .env.docker
      else
        echo .env
      fi
  DC:
    sh: |
      if [ -f .env ]; then
        echo "docker compose --env-file .env"
      elif [ -f .env.docker ]; then
        echo "docker compose --env-file .env.docker"
      else
        echo "docker compose"
      fi

  # 内部
  DUMP_DIR: .tmp
  WP: '{{.LOCAL_PHP}} -c "{{.LOCAL_PHPINI}}" wp-cli.phar'
  RSYNC_SSH: rsync -avz -e "ssh -p 10022"
  DOCKER_WP_JP_PORT: '{{default ._DOCKER_COMPOSE_HOST_PORT_WP_JP .WP_JP_PORT | default "8080"}}'
  DOCKER_WP_EN_PORT: '{{default ._DOCKER_COMPOSE_HOST_PORT_WP_EN .WP_EN_PORT | default "8081"}}'
  DOCKER_WP_BOGO_PORT: '{{default ._DOCKER_COMPOSE_HOST_PORT_WP_BOGO .WP_BOGO_PORT | default "8082"}}'
  DOCKER_MAILPIT_UI_PORT: '{{default ._DOCKER_COMPOSE_HOST_PORT_MAILPIT_UI .MAILPIT_UI_PORT | default "8025"}}'

tasks:

  setup:
    desc: wp-cli をダウンロード
    status:
      - test -f wp-cli.phar
    cmds:
      - curl -sO https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
      - '{{.WP}} --version'

  # ==========================================================
  # ステージング → ローカル（pull 系）
  # ==========================================================

  pull:
    desc: DB + 全ファイルをステージングからローカルに完全同期
    cmds:
      - task: db:pull
      - task: files:pull

  pull:diff:
    desc: DB + 差分ファイルだけステージングからローカルに同期
    cmds:
      - task: db:pull
      - task: files:diff

  # --- DB ---

  db:pull:
    desc: ステージング DB をローカルに取り込み＆URL置換
    deps: [setup]
    cmds:
      - task: db:backup
      - task: db:fetch
      - task: db:import
      - task: db:replace
      - task: db:flush
      - cmd: rm -f {{.DUMP_DIR}}/staging.sql
        silent: true
      - echo "DB同期完了！"

  db:backup:
    internal: true
    deps: [setup]
    cmds:
      - mkdir -p {{.DUMP_DIR}}
      - cmd: >-
          "{{.LOCAL_MYSQLDUMP}}"
          -u root -proot -h 127.0.0.1 -P {{.LOCAL_MYSQL_PORT}}
          --single-transaction --quick --default-character-set=utf8mb4
          local > "{{.DUMP_DIR}}/local-backup-$(date +%Y%m%d-%H%M%S).sql"
      - echo "ローカルDBバックアップ完了"

  db:fetch:
    internal: true
    cmds:
      - mkdir -p {{.DUMP_DIR}}
      - >-
        ssh {{.SSH_HOST}} "mysqldump
        -u {{.STAGING_DB_USER}} -p{{.STAGING_DB_PASS}} {{.STAGING_DB_NAME}}
        --single-transaction --quick --default-character-set=utf8mb4"
        > {{.DUMP_DIR}}/staging.sql
      - echo "ステージングDBダンプ完了"

  db:import:
    internal: true
    cmds:
      - >-
        "{{.LOCAL_MYSQL}}"
        -u root -proot -h 127.0.0.1 -P {{.LOCAL_MYSQL_PORT}}
        local < {{.DUMP_DIR}}/staging.sql
      - echo "インポート完了"

  db:replace:
    internal: true
    cmds:
      - >-
        {{.WP}} search-replace "{{.STAGING_URL}}" "{{.LOCAL_URL}}"
        --all-tables --precise --skip-columns=guid --report-changed-only
      - >-
        {{.WP}} search-replace "//musashipaint.xsrv.jp" "//localhost:10010"
        --all-tables --precise --skip-columns=guid --report-changed-only
      - echo "URL置換完了"

  db:flush:
    internal: true
    cmds:
      - '{{.WP}} transient delete --all'
      - '{{.WP}} cache flush'
      - '{{.WP}} rewrite flush'
      - echo "キャッシュクリア完了"

  # --- ファイル ---

  files:pull:
    desc: ステージングの wp-content を丸ごとローカルに上書き同期（--delete付き）
    cmds:
      - >-
        {{.RSYNC_SSH}} --progress --delete
        {{.RSYNC_EXCLUDES}}
        {{.STAGING_SSH_FULL}}:{{.STAGING_PATH}}/wp-content/themes/
        wp-content/themes/
      - >-
        {{.RSYNC_SSH}} --progress --delete
        {{.RSYNC_EXCLUDES}}
        {{.STAGING_SSH_FULL}}:{{.STAGING_PATH}}/wp-content/plugins/
        wp-content/plugins/
      - >-
        {{.RSYNC_SSH}} --progress
        {{.STAGING_SSH_FULL}}:{{.STAGING_PATH}}/wp-content/uploads/
        wp-content/uploads/
      - >-
        {{.RSYNC_SSH}} --progress
        {{.STAGING_SSH_FULL}}:{{.STAGING_PATH}}/wp-content/languages/
        wp-content/languages/
      - echo "全ファイル同期完了"

  files:diff:
    desc: ステージングとの差分ファイルだけ取り込み（ローカル独自ファイルは残す）
    cmds:
      - >-
        {{.RSYNC_SSH}} --progress
        {{.RSYNC_EXCLUDES}}
        {{.STAGING_SSH_FULL}}:{{.STAGING_PATH}}/wp-content/themes/
        wp-content/themes/
      - >-
        {{.RSYNC_SSH}} --progress
        {{.RSYNC_EXCLUDES}}
        {{.STAGING_SSH_FULL}}:{{.STAGING_PATH}}/wp-content/plugins/
        wp-content/plugins/
      - >-
        {{.RSYNC_SSH}} --progress
        {{.STAGING_SSH_FULL}}:{{.STAGING_PATH}}/wp-content/uploads/
        wp-content/uploads/
      - >-
        {{.RSYNC_SSH}} --progress
        {{.STAGING_SSH_FULL}}:{{.STAGING_PATH}}/wp-content/languages/
        wp-content/languages/
      - echo "差分ファイル同期完了"

  files:dry-run:
    desc: 差分プレビュー（実際には同期しない）
    cmds:
      - echo "=== themes ==="
      - >-
        {{.RSYNC_SSH}} --dry-run
        {{.RSYNC_EXCLUDES}}
        {{.STAGING_SSH_FULL}}:{{.STAGING_PATH}}/wp-content/themes/
        wp-content/themes/
      - echo "=== plugins ==="
      - >-
        {{.RSYNC_SSH}} --dry-run
        {{.RSYNC_EXCLUDES}}
        {{.STAGING_SSH_FULL}}:{{.STAGING_PATH}}/wp-content/plugins/
        wp-content/plugins/
      - echo "=== uploads ==="
      - >-
        {{.RSYNC_SSH}} --dry-run
        {{.STAGING_SSH_FULL}}:{{.STAGING_PATH}}/wp-content/uploads/
        wp-content/uploads/

  uploads:pull:
    desc: ステージングの uploads だけ同期
    cmds:
      - >-
        {{.RSYNC_SSH}} --progress
        {{.STAGING_SSH_FULL}}:{{.STAGING_PATH}}/wp-content/uploads/
        wp-content/uploads/
      - echo "uploads同期完了"

  # ==========================================================
  # ローカル → ステージング（push 系）
  # ==========================================================

  push:
    desc: DB + テーマをステージングに全反映（要確認・AI実行不可）
    preconditions:
      - sh: test -t 0
        msg: "⛔ push 系コマンドは対話型ターミナルからのみ実行できます"
    prompt:
      - "危険な操作です。ローカルの DB + テーマをステージングに反映します"
      - "続行する場合のみ y を入力してください。y 以外は中止します"
    cmds:
      - task: db:push:exec
      - task: theme:push:exec

  db:push:
    desc: ローカル DB をステージングに反映（要確認・AI実行不可）
    preconditions:
      - sh: test -t 0
        msg: "⛔ push 系コマンドは対話型ターミナルからのみ実行できます"
    prompt:
      - "危険な操作です。ローカル DB をステージングに上書きします"
      - "続行する場合のみ y を入力してください。y 以外は中止します"
    deps: [setup]
    cmds:
      - task: db:push:exec

  db:push:exec:
    internal: true
    deps: [setup]
    cmds:
      - mkdir -p {{.DUMP_DIR}}
      # 1. ローカルDBバックアップ
      - cmd: >-
          "{{.LOCAL_MYSQLDUMP}}"
          -u root -proot -h 127.0.0.1 -P {{.LOCAL_MYSQL_PORT}}
          --single-transaction --quick --default-character-set=utf8mb4
          local > "{{.DUMP_DIR}}/local-backup-$(date +%Y%m%d-%H%M%S).sql"
      - echo "ローカルDBバックアップ完了"
      # 2. URL置換（ローカル→ステージング）※ローカルDBを一時的に書き換える
      - >-
        {{.WP}} search-replace "{{.LOCAL_URL}}" "{{.STAGING_URL}}"
        --all-tables --precise --skip-columns=guid --report-changed-only
      - >-
        {{.WP}} search-replace "//localhost:10010" "//musashipaint.xsrv.jp"
        --all-tables --precise --skip-columns=guid --report-changed-only
      # 3. ステージングURL済みのDBをエクスポート
      - cmd: >-
          "{{.LOCAL_MYSQLDUMP}}"
          -u root -proot -h 127.0.0.1 -P {{.LOCAL_MYSQL_PORT}}
          --single-transaction --quick --default-character-set=utf8mb4
          local > "{{.DUMP_DIR}}/push-staging.sql"
      # 4. ローカルDBを元に戻す（ローカルURL）
      - >-
        {{.WP}} search-replace "{{.STAGING_URL}}" "{{.LOCAL_URL}}"
        --all-tables --precise --skip-columns=guid --report-changed-only
      - >-
        {{.WP}} search-replace "//musashipaint.xsrv.jp" "//localhost:10010"
        --all-tables --precise --skip-columns=guid --report-changed-only
      - echo "URL置換＆エクスポート完了"
      # 5. ステージングDBをバックアップ
      - >-
        ssh {{.SSH_HOST}} "mysqldump
        -u {{.STAGING_DB_USER}} -p{{.STAGING_DB_PASS}} {{.STAGING_DB_NAME}}
        --single-transaction --quick --default-character-set=utf8mb4"
        > {{.DUMP_DIR}}/staging-backup-$(date +%Y%m%d-%H%M%S).sql
      - echo "ステージングDBバックアップ完了"
      # 6. ステージングにインポート
      - >-
        ssh {{.SSH_HOST}} "mysql
        -u {{.STAGING_DB_USER}} -p{{.STAGING_DB_PASS}} {{.STAGING_DB_NAME}}"
        < {{.DUMP_DIR}}/push-staging.sql
      - echo "ステージングDBインポート完了"
      # 7. クリーンアップ
      - cmd: rm -f {{.DUMP_DIR}}/push-staging.sql
        silent: true
      - echo "DB push 完了！"

  theme:push:
    desc: テーマをステージングにデプロイ（要確認・AI実行不可）
    preconditions:
      - sh: test -t 0
        msg: "⛔ push 系コマンドは対話型ターミナルからのみ実行できます"
    prompt:
      - "危険な操作です。テーマをステージングにデプロイします"
      - "続行する場合のみ y を入力してください。y 以外は中止します"
    cmds:
      - task: theme:push:exec

  theme:push:exec:
    internal: true
    cmds:
      - >-
        {{.RSYNC_SSH}} --progress --delete
        --exclude='node_modules/'
        --exclude='.git/'
        --exclude='.sass-cache/'
        wp-content/themes/muashi/
        {{.STAGING_SSH_FULL}}:{{.STAGING_PATH}}/wp-content/themes/muashi/
      - echo "テーマデプロイ完了"

  # ==========================================================
  # マイグレーション（SSH経由でステージング上のスクリプト実行）
  # ==========================================================

  migrate:sidebar:
    desc: ステージングでサイドバーメニュー初期化を実行
    preconditions:
      - sh: test -t 0
        msg: "⛔ 対話型ターミナルからのみ実行できます"
    prompt:
      - "危険な操作です。ステージングでサイドバーメニュー初期化を実行します"
      - "続行する場合のみ y を入力してください。y 以外は中止します"
    cmds:
      - >-
        ssh -p 10022 {{.STAGING_SSH_FULL}}
        "cd {{.STAGING_PATH}} && php wp-content/themes/muashi/inc/setup-document-menu.php"
      - echo "マイグレーション完了"

  migrate:all-menus:
    desc: ステージングで全サイドバーメニューを一括初期化
    preconditions:
      - sh: test -t 0
        msg: "⛔ 対話型ターミナルからのみ実行できます"
    prompt:
      - "危険な操作です。ステージングの全サイドバーメニューを再初期化します"
      - "続行する場合のみ y を入力してください。y 以外は中止します"
    cmds:
      - >-
        ssh -p 10022 {{.STAGING_SSH_FULL}}
        "cd {{.STAGING_PATH}} && php wp-content/themes/muashi/inc/run-all-menu-setup.php"
      - echo "全メニュー初期化完了"

  # ==========================================================
  # Docker ローカル開発環境
  # ==========================================================

  init:
    desc: Docker環境の初期セットアップ（破壊→再構築→起動→検証→DB同期→停止）
    cmds:
      - 'docker info > /dev/null 2>&1 || (echo "ERROR: Docker Desktopを起動してください" && exit 1)'
      - cmd: |
          if [ ! -f .env ]; then
            if [ -f .env.docker ]; then
              cp .env.docker .env
              echo "INFO: 既存の .env.docker を .env に移行しました"
            elif [ -f .env.example ]; then
              cp .env.example .env
              echo "INFO: .env を作成しました。ステージングDB認証情報を設定してください"
            else
              echo "ERROR: .env.example が見つかりません"
              exit 1
            fi
          fi
      - '{{.DC}} down -v --remove-orphans 2>/dev/null || true'
      - '{{.DC}} build'
      - '{{.DC}} up -d'
      - cmd: |
          ENV_FILE="{{.DOCKER_ENV_FILE}}"
          if [ -f "$ENV_FILE" ]; then
            while IFS= read -r env_line || [ -n "$env_line" ]; do
              env_line="${env_line%$'\r'}"
              case "$env_line" in
                ""|\#*)
                  continue
                  ;;
              esac
              env_key=${env_line%%=*}
              env_value=${env_line#*=}
              env_value=${env_value//\$\$/\$}
              export "$env_key=$env_value"
            done < "$ENV_FILE"
          fi
          echo "サービス起動待機中..."
          i=1
          while [ "$i" -le 90 ]; do
            if curl -sf http://localhost:${_DOCKER_COMPOSE_HOST_PORT_WP_JP:-${WP_JP_PORT:-8080}}/ > /dev/null 2>&1; then
              echo "JP WordPress 準備完了"
              break
            fi
            powershell -NoProfile -Command "Start-Sleep -Seconds 2" > /dev/null 2>&1
            i=$((i + 1))
          done
          i=1
          while [ "$i" -le 90 ]; do
            if curl -sf http://localhost:${_DOCKER_COMPOSE_HOST_PORT_WP_EN:-${WP_EN_PORT:-8081}}/ > /dev/null 2>&1; then
              echo "EN WordPress 準備完了"
              break
            fi
            powershell -NoProfile -Command "Start-Sleep -Seconds 2" > /dev/null 2>&1
            i=$((i + 1))
          done
          i=1
          while [ "$i" -le 90 ]; do
            if curl -sf http://localhost:${_DOCKER_COMPOSE_HOST_PORT_WP_BOGO:-${WP_BOGO_PORT:-8082}}/ > /dev/null 2>&1; then
              echo "Bogo WordPress 準備完了"
              break
            fi
            powershell -NoProfile -Command "Start-Sleep -Seconds 2" > /dev/null 2>&1
            i=$((i + 1))
          done
      - cmd: |
          ENV_FILE="{{.DOCKER_ENV_FILE}}"
          if [ -f "$ENV_FILE" ]; then
            while IFS= read -r env_line || [ -n "$env_line" ]; do
              env_line="${env_line%$'\r'}"
              case "$env_line" in
                ""|\#*)
                  continue
                  ;;
              esac
              env_key=${env_line%%=*}
              env_value=${env_line#*=}
              env_value=${env_value//\$\$/\$}
              export "$env_key=$env_value"
            done < "$ENV_FILE"
          fi
          echo ""
          echo "========================================="
          if curl -sf http://localhost:${_DOCKER_COMPOSE_HOST_PORT_WP_JP:-${WP_JP_PORT:-8080}}/ > /dev/null 2>&1; then
            echo "  JP:   http://localhost:${_DOCKER_COMPOSE_HOST_PORT_WP_JP:-${WP_JP_PORT:-8080}} ... OK"
          else
            echo "  JP:   http://localhost:${_DOCKER_COMPOSE_HOST_PORT_WP_JP:-${WP_JP_PORT:-8080}} ... FAIL"
          fi
          if curl -sf http://localhost:${_DOCKER_COMPOSE_HOST_PORT_WP_EN:-${WP_EN_PORT:-8081}}/ > /dev/null 2>&1; then
            echo "  EN:   http://localhost:${_DOCKER_COMPOSE_HOST_PORT_WP_EN:-${WP_EN_PORT:-8081}} ... OK"
          else
            echo "  EN:   http://localhost:${_DOCKER_COMPOSE_HOST_PORT_WP_EN:-${WP_EN_PORT:-8081}} ... FAIL"
          fi
          if curl -sf http://localhost:${_DOCKER_COMPOSE_HOST_PORT_WP_BOGO:-${WP_BOGO_PORT:-8082}}/ > /dev/null 2>&1; then
            echo "  Bogo: http://localhost:${_DOCKER_COMPOSE_HOST_PORT_WP_BOGO:-${WP_BOGO_PORT:-8082}} ... OK"
          else
            echo "  Bogo: http://localhost:${_DOCKER_COMPOSE_HOST_PORT_WP_BOGO:-${WP_BOGO_PORT:-8082}} ... FAIL"
          fi
          if curl -sf http://localhost:${_DOCKER_COMPOSE_HOST_PORT_MAILPIT_UI:-${MAILPIT_UI_PORT:-8025}}/ > /dev/null 2>&1; then
            echo "  Mail: http://localhost:${_DOCKER_COMPOSE_HOST_PORT_MAILPIT_UI:-${MAILPIT_UI_PORT:-8025}} ... OK"
          else
            echo "  Mail: http://localhost:${_DOCKER_COMPOSE_HOST_PORT_MAILPIT_UI:-${MAILPIT_UI_PORT:-8025}} ... FAIL"
          fi
          echo "========================================="
          echo ""
      - cmd: |
          cleanup() {
            {{.DC}} down
            echo "Docker環境を停止しました"
            echo "task up で起動、task down で停止"
          }
          trap cleanup EXIT
          echo "ステージングDBをDocker環境へ同期中..."
          task db:sync
          sync_status=$?
          if [ "$sync_status" -eq 0 ]; then
            echo "Docker JP/EN DB同期完了"
          fi
          exit "$sync_status"

  up:
    desc: "全コンテナ起動（例: task up -- jp でJPを前面ログ表示）"
    cmds:
      - cmd: |
          case "{{.CLI_ARGS}}" in
            jp)
              {{.DC}} up -d musashi-db musashi-wp-jp musashi-mail
              {{.DC}} logs -f musashi-wp-jp
              ;;
            en)
              {{.DC}} up -d musashi-db musashi-wp-en musashi-mail
              {{.DC}} logs -f musashi-wp-en
              ;;
            bogo)
              {{.DC}} up -d musashi-db musashi-wp-bogo musashi-mail
              {{.DC}} logs -f musashi-wp-bogo
              ;;
            "")
              {{.DC}} up -d
              ;;
            *)
              echo "ERROR: 対応引数は jp / en / bogo のみです"
              exit 1
              ;;
          esac

  up:jp:
    desc: JP環境のみ起動（DB + JP + Mailpit）
    cmds:
      - '{{.DC}} up -d musashi-db musashi-wp-jp musashi-mail'

  up:en:
    desc: EN環境のみ起動（DB + EN + Mailpit）
    cmds:
      - '{{.DC}} up -d musashi-db musashi-wp-en musashi-mail'

  up:bogo:
    desc: Bogo+Bedrock環境のみ起動（DB + Bogo + Mailpit）
    cmds:
      - '{{.DC}} up -d musashi-db musashi-wp-bogo musashi-mail'

  down:
    desc: 全コンテナ停止（データは保持）
    cmds:
      - '{{.DC}} down'

  down:jp:
    desc: JP WordPressのみ停止
    cmds:
      - '{{.DC}} stop musashi-wp-jp'

  down:en:
    desc: EN WordPressのみ停止
    cmds:
      - '{{.DC}} stop musashi-wp-en'

  down:bogo:
    desc: Bogo WordPressのみ停止
    cmds:
      - '{{.DC}} stop musashi-wp-bogo'

  logs:
    desc: 全コンテナのログ表示
    cmds:
      - '{{.DC}} logs -f'

  logs:jp:
    desc: JP WordPressのログ表示
    cmds:
      - '{{.DC}} logs -f musashi-wp-jp'

  logs:en:
    desc: EN WordPressのログ表示
    cmds:
      - '{{.DC}} logs -f musashi-wp-en'

  logs:bogo:
    desc: Bogo WordPressのログ表示
    cmds:
      - '{{.DC}} logs -f musashi-wp-bogo'

  shell:jp:
    desc: JP WordPressコンテナにbash接続
    interactive: true
    cmds:
      - '{{.DC}} exec musashi-wp-jp bash'

  shell:en:
    desc: EN WordPressコンテナにbash接続
    interactive: true
    cmds:
      - '{{.DC}} exec musashi-wp-en bash'

  shell:bogo:
    desc: Bogo WordPressコンテナにbash接続
    interactive: true
    cmds:
      - '{{.DC}} exec musashi-wp-bogo bash'

  wp:jp:
    desc: "JP環境でWP-CLI実行（例: task wp:jp -- plugin list）"
    cmds:
      - '{{.DC}} exec -T musashi-wp-jp wp {{.CLI_ARGS}} --allow-root'

  wp:en:
    desc: "EN環境でWP-CLI実行（例: task wp:en -- option list）"
    cmds:
      - '{{.DC}} exec -T musashi-wp-en wp {{.CLI_ARGS}} --allow-root'

  wp:bogo:
    desc: "Bogo環境でWP-CLI実行（例: task wp:bogo -- plugin list）"
    cmds:
      - '{{.DC}} exec -T musashi-wp-bogo wp {{.CLI_ARGS}} --path=/var/www/html/web/wp --allow-root'

  db:sync:
    desc: ステージングDBをDocker環境に同期（EN情報未設定時はJPのみ）
    cmds:
      - task: db:sync:jp
      - cmd: |
          while IFS= read -r env_line || [ -n "$env_line" ]; do
            env_line="${env_line%$'\r'}"
            case "$env_line" in
              ""|\#*)
                continue
                ;;
            esac
            env_key=${env_line%%=*}
            env_value=${env_line#*=}
            env_value=${env_value//\$\$/\$}
            export "$env_key=$env_value"
          done < {{.DOCKER_ENV_FILE}}
          if [ -z "$STAGING_EN_DB_USER" ] || [ -z "$STAGING_EN_DB_PASS" ] || [ -z "$STAGING_EN_DB_NAME" ] || [ -z "$STAGING_EN_URL" ]; then
            echo "INFO: EN用ステージングDB情報が未設定のため、EN同期をスキップしました"
            exit 0
          fi
          task db:sync:en

  db:sync:jp:
    desc: ステージングDBをDocker JP環境に同期
    deps: [up:jp]
    cmds:
      - cmd: |
          while IFS= read -r env_line || [ -n "$env_line" ]; do
            env_line="${env_line%$'\r'}"
            case "$env_line" in
              ""|\#*)
                continue
                ;;
            esac
            env_key=${env_line%%=*}
            env_value=${env_line#*=}
            env_value=${env_value//\$\$/\$}
            export "$env_key=$env_value"
          done < {{.DOCKER_ENV_FILE}}
          mkdir -p .tmp
          ssh "$STAGING_SSH_HOST" "mysqldump \
            -u $STAGING_JP_DB_USER -p$STAGING_JP_DB_PASS $STAGING_JP_DB_NAME \
            --single-transaction --quick --default-character-set=utf8mb4" \
            > .tmp/docker-staging-jp.sql
          {{.DC}} exec -T musashi-db mysql -u root -p$MYSQL_ROOT_PASSWORD $JP_DB_NAME < .tmp/docker-staging-jp.sql
          {{.DC}} exec -T musashi-wp-jp wp search-replace \
            "$STAGING_JP_URL" "$JP_WP_HOME" \
            --all-tables --precise --skip-columns=guid --report-changed-only --allow-root
          {{.DC}} exec -T musashi-wp-jp wp cache flush --allow-root
          rm -f .tmp/docker-staging-jp.sql
          echo "Docker JP DB同期完了！"

  db:sync:en:
    desc: ステージング(EN) DBをDocker EN環境に同期（要 STAGING_EN_* 設定）
    deps: [up:en]
    cmds:
      - cmd: |
          while IFS= read -r env_line || [ -n "$env_line" ]; do
            env_line="${env_line%$'\r'}"
            case "$env_line" in
              ""|\#*)
                continue
                ;;
            esac
            env_key=${env_line%%=*}
            env_value=${env_line#*=}
            env_value=${env_value//\$\$/\$}
            export "$env_key=$env_value"
          done < {{.DOCKER_ENV_FILE}}
          if [ -z "$STAGING_EN_DB_USER" ] || [ -z "$STAGING_EN_DB_PASS" ] || [ -z "$STAGING_EN_DB_NAME" ] || [ -z "$STAGING_EN_URL" ]; then
            echo "ERROR: EN用ステージングDB情報が不足しています。.env の STAGING_EN_* を設定してください"
            exit 1
          fi
          mkdir -p .tmp
          ssh "$STAGING_SSH_HOST" "mysqldump \
            -u $STAGING_EN_DB_USER -p$STAGING_EN_DB_PASS $STAGING_EN_DB_NAME \
            --single-transaction --quick --default-character-set=utf8mb4" \
            > .tmp/docker-staging-en.sql
          {{.DC}} exec -T musashi-db mysql -u root -p$MYSQL_ROOT_PASSWORD $EN_DB_NAME < .tmp/docker-staging-en.sql
          {{.DC}} exec -T musashi-wp-en wp search-replace \
            "$STAGING_EN_URL" "$EN_WP_HOME" \
            --all-tables --precise --skip-columns=guid --report-changed-only --allow-root
          {{.DC}} exec -T musashi-wp-en wp cache flush --allow-root
          rm -f .tmp/docker-staging-en.sql
          echo "Docker EN DB同期完了！"

  gulp:
    desc: Docker環境用のGulp watch起動（BrowserSync → localhost:8080）
    cmds:
      - npx gulp

  destroy:
    desc: 全コンテナ・ボリューム・イメージを完全削除（データ全消去）
    preconditions:
      - sh: test -t 0
        msg: "⛔ 対話型ターミナルからのみ実行できます"
    prompt:
      - "危険な操作です。全てのDockerデータを削除します"
      - "続行する場合のみ y を入力してください。y 以外は中止します"
    cmds:
      - '{{.DC}} down -v --rmi local --remove-orphans'
      - echo "Docker環境を完全削除しました"

  rebuild:
    desc: イメージをリビルドして再起動（Dockerfile変更後に使用）
    cmds:
      - '{{.DC}} build --no-cache'
      - '{{.DC}} up -d'
