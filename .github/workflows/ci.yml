name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # PR/manual の入口はここに集約し、実体は Test へ委譲する。
  # push:main は Trusted Test が担うので二重起動させない。
  test:
    name: Test suite
    uses: ./.github/workflows/test.yml
