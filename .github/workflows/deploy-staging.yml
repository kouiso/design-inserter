name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（実際にはデプロイしない）'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-staging-manual
  cancel-in-progress: false

jobs:
  deploy-xserver-jp:
    name: Deploy Xserver Staging (JP)
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      server_label: 'Xserver (Staging JP)'
      dry_run: ${{ inputs.dry_run || false }}
      ref: ${{ github.ref }}
      source_theme_dir: muashi
      dest_theme_dir: muashi
    secrets:
      XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
      XSERVER_PORT: ${{ secrets.XSERVER_PORT }}
      XSERVER_USER: ${{ secrets.XSERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  deploy-xserver-en:
    name: Deploy Xserver Staging (EN)
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging-en
      server_label: 'Xserver (Staging EN)'
      dry_run: ${{ inputs.dry_run || false }}
      ref: ${{ github.ref }}
      source_theme_dir: muashi-en
      dest_theme_dir: muashi
    secrets:
      XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
      XSERVER_PORT: ${{ secrets.XSERVER_PORT }}
      XSERVER_USER: ${{ secrets.XSERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  deploy-wpx-jp:
    name: Deploy wpX Staging (JP)
    uses: ./.github/workflows/deploy.yml
    with:
      environment: wpx-staging
      server_label: 'wpX (Staging JP)'
      dry_run: ${{ inputs.dry_run || false }}
      ref: ${{ github.ref }}
      source_theme_dir: muashi
      dest_theme_dir: muashi
    secrets:
      XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
      XSERVER_PORT: ${{ secrets.XSERVER_PORT }}
      XSERVER_USER: ${{ secrets.XSERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  deploy-wpx-en:
    name: Deploy wpX Staging (EN)
    uses: ./.github/workflows/deploy.yml
    with:
      environment: wpx-staging-en
      server_label: 'wpX (Staging EN)'
      dry_run: ${{ inputs.dry_run || false }}
      ref: ${{ github.ref }}
      source_theme_dir: muashi-en
      dest_theme_dir: muashi
    secrets:
      XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
      XSERVER_PORT: ${{ secrets.XSERVER_PORT }}
      XSERVER_USER: ${{ secrets.XSERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
