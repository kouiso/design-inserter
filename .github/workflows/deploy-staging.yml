name: Deploy to Staging

on:
  push:
    branches: [develop]
    paths:
      - 'wp-content/themes/muashi/**'
      - 'wp-content/plugins/musashi-inquiry-approval/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（実際にはデプロイしない）'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      server_label: "musashipaint.xsrv.jp/staging (Staging)"
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
      XSERVER_PORT: ${{ secrets.XSERVER_PORT }}
      XSERVER_USER: ${{ secrets.XSERVER_USER }}
      XSERVER_PATH: ${{ secrets.XSERVER_PATH }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
