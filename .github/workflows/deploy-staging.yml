name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'デプロイ先を選択'
        required: false
        type: choice
        default: all
        options:
          - all
          - wpx-jp
          - wpx-en
      dry_run:
        description: 'ドライラン（実際にはデプロイしない）'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-staging-manual
  cancel-in-progress: false

jobs:
  deploy-wpx-jp:
    if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'wpx-jp' }}
    name: Deploy wpX Staging (JP)
    uses: ./.github/workflows/deploy.yml
    with:
      environment: wpx-staging
      server_label: 'wpX (Staging JP)'
      dry_run: ${{ inputs.dry_run || false }}
      ref: ${{ github.ref }}
      source_theme_dir: muashi
      dest_theme_dir: muashi
    secrets:
      XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
      XSERVER_PORT: ${{ secrets.XSERVER_PORT }}
      XSERVER_USER: ${{ secrets.XSERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  deploy-wpx-en:
    if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'wpx-en' }}
    name: Deploy wpX Staging (EN)
    uses: ./.github/workflows/deploy.yml
    with:
      environment: wpx-staging-en
      server_label: 'wpX (Staging EN)'
      dry_run: ${{ inputs.dry_run || false }}
      ref: ${{ github.ref }}
      source_theme_dir: muashi-en
      dest_theme_dir: muashi
    secrets:
      XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
      XSERVER_PORT: ${{ secrets.XSERVER_PORT }}
      XSERVER_USER: ${{ secrets.XSERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
