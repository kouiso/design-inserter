name: Deploy to wpX Staging (EN)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（実際にはデプロイしない）'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-wpx-staging-en
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: wpx-staging-en
      server_label: "xw987067.xwp.jp (wpX Staging EN)"
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
      XSERVER_PORT: ${{ secrets.XSERVER_PORT }}
      XSERVER_USER: ${{ secrets.XSERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
