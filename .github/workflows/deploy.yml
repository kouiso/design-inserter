name: Deploy to Xserver

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      server_label:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
      ref:
        required: false
        type: string
        description: 'チェックアウトするブランチ/ref（未指定時はワークフローのデフォルト）'
    secrets:
      XSERVER_HOST:
        required: true
      XSERVER_PORT:
        required: true
      XSERVER_USER:
        required: true
      XSERVER_PATH:
        required: true
      SSH_PRIVATE_KEY:
        required: true

jobs:
  deploy:
    name: Deploy to ${{ inputs.server_label }}
    runs-on: blacksmith-4vcpu-ubuntu-2204
    environment: ${{ inputs.environment }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.XSERVER_PORT }} ${{ secrets.XSERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy Theme via rsync
        run: |
          rsync -avz --delete \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            --exclude='.claude/' \
            --exclude='.idea/' \
            --exclude='.vscode/' \
            --exclude='docs/' \
            --exclude='src/' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.DS_Store' \
            --exclude='node_modules/' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.XSERVER_PORT }}" \
            ./wp-content/themes/muashi/ \
            ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }}:${{ secrets.XSERVER_PATH }}/wp-content/themes/muashi/

      - name: Deploy Plugin via rsync
        run: |
          rsync -avz --delete \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.XSERVER_PORT }}" \
            ./wp-content/plugins/musashi-inquiry-approval/ \
            ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }}:${{ secrets.XSERVER_PATH }}/wp-content/plugins/musashi-inquiry-approval/

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "> **DRY RUN** - No files were actually deployed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Server** | ${{ inputs.server_label }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | [\`${GITHUB_SHA::7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${GITHUB_REF_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Actor** | @${GITHUB_ACTOR} |" >> $GITHUB_STEP_SUMMARY
