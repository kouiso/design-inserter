name: Security Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: blacksmith-4vcpu-ubuntu-2204

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true

      - name: Check for WordPress version
        run: |
          if [ -f "wp-includes/version.php" ]; then
            echo "WordPress version file found"
            grep "wp_version" wp-includes/version.php || true
          fi

  code-quality:
    name: Code Quality Check
    runs-on: blacksmith-4vcpu-ubuntu-2204

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
        with:
          php-version: '8.2'
          tools: phpcs

      - name: Check PHP syntax
        run: |
          find . -name "*.php" -not -path "./wp-admin/*" -not -path "./wp-includes/*" -not -path "./wp-content/plugins/*" -not -path "./wp-content/themes/twenty*" -exec php -l {} \;

      - name: Install WordPress Coding Standards
        if: hashFiles('phpcs.xml') != '' || hashFiles('phpcs.xml.dist') != ''
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev wp-coding-standards/wpcs:"^3.0"

      - name: WordPress Coding Standards (if available)
        if: hashFiles('phpcs.xml') != '' || hashFiles('phpcs.xml.dist') != ''
        run: |
          phpcs --standard=WordPress --extensions=php wp-content/themes/ wp-content/plugins/
        continue-on-error: true

  secret-scan:
    name: Secret Scanning
    runs-on: blacksmith-4vcpu-ubuntu-2204

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.93.4
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          head: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          extra_args: --only-verified

  semgrep:
    name: Semgrep コード品質スキャン
    runs-on: blacksmith-4vcpu-ubuntu-2204
    container:
      image: semgrep/semgrep
    if: (github.actor != 'dependabot[bot]')

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Semgrep
        run: semgrep scan --config auto
        continue-on-error: true
