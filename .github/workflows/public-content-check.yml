name: Public Content Check

# なぜ: このリポは公開されている。issue・PR・コメントに秘密や個人情報を書いても気づける仕組みが無かった。
# 本文は検査して知らせるだけで、自動編集・削除はしない。詳細は doc/public-content-check.md。
#
# 注意: issues / issue_comment / pull_request_target 系のワークフローは、既定の枝（main）にある物だけが動く。
# develop にマージしただけでは動かず、develop から main へのリリース後に効き始める。
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited, reopened]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]

# 外から来たコードを取り出して実行しないための最小権限。書き込みはコメントの作成・更新だけ。
permissions:
  contents: read
  issues: write
  pull-requests: write

# なぜ: 対象ごとに直列化して、同じ目印コメントを 2 つ作らない。別の対象は互いに待たせない。
concurrency:
  group: public-content-check-${{ github.event_name }}-${{ github.event.comment.id || github.event.review.id || github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  check:
    name: Check public content
    # 自分（github-actions[bot]）のコメントを検査すると、コメント更新が次の起動を呼んで止まらなくなる。
    if: github.event.comment.user.login != 'github-actions[bot]' && github.event.review.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ref を指定しない。pull_request_target では base（既定の枝）が取り出され、PR の head は取り出さない。
      # PR の外から来たコードは取り出さない・実行しない。使うのは base にある検査スクリプトと規則ファイルだけ。
      - name: Checkout (base only)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/public-content-rules.json

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Scan issue / PR / comment text
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 持ち主固有の語（顧客名・禁止語・DB 名など）の規則。公開リポのファイルには書けないので secret で渡す。
          # 未設定なら空文字になり、何も足さない。渡し方（secret を作るか）は持ち主が決める。
          PUBLIC_CONTENT_EXTRA_RULES: ${{ secrets.PUBLIC_CONTENT_EXTRA_RULES }}
        run: node .github/scripts/public-content-check.mjs
