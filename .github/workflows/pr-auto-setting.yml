name: PR Auto Setting

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  auto-setting:
    name: Auto assign & label
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Assign author and add branch label
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const pr = context.payload.pull_request;

            // PR作成者を自動アサイン
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              assignees: [pr.user.login]
            });
            core.info(`Assigned ${pr.user.login} to PR #${pr.number}`);

            // ブランチプレフィックスに基づくラベル付与
            const branchName = pr.head.ref;
            const prefixMap = {
              'feature/': 'feature',
              'feat/': 'feature',
              'fix/': 'bugfix',
              'bugfix/': 'bugfix',
              'chore/': 'chore',
              'refactor/': 'refactor',
              'release/': 'release',
              'hotfix/': 'hotfix',
              'copilot/': 'copilot'
            };

            for (const [prefix, label] of Object.entries(prefixMap)) {
              if (branchName.startsWith(prefix)) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: [label]
                });
                core.info(`Added "${label}" label for branch prefix "${prefix}"`);
                break;
              }
            }
