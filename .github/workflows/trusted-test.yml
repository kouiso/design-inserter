name: Trusted Test

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHPUnit + PHPCS (decrypted catalog)
    runs-on: ubuntu-24.04
    environment: git-crypt-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Unlock encrypted catalogs
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$GIT_CRYPT_KEY" ]]; then
            echo "::error::GIT_CRYPT_KEY is required for trusted repository runs"
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/git-crypt-key"
          trap 'rm -f "$key_file"' EXIT
          sudo apt-get install -y -qq git-crypt
          printf '%s' "$GIT_CRYPT_KEY" | base64 --decode > "$key_file"
          git-crypt unlock "$key_file"

      - name: PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml.dist

      - name: PHPCS
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

      - name: PHP lint (plugin source)
        run: find wp-content/plugins/designinserter tests -name '*.php' -print0 | xargs -0 -n1 php -l

  js:
    name: JS syntax + catalog smoke (decrypted catalog)
    runs-on: ubuntu-24.04
    environment: git-crypt-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup PHP 8.2 (for npm test PHP smoke)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: Unlock encrypted catalogs
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$GIT_CRYPT_KEY" ]]; then
            echo "::error::GIT_CRYPT_KEY is required for trusted repository runs"
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/git-crypt-key"
          trap 'rm -f "$key_file"' EXIT
          sudo apt-get install -y -qq git-crypt
          printf '%s' "$GIT_CRYPT_KEY" | base64 --decode > "$key_file"
          git-crypt unlock "$key_file"

      - name: JS syntax check
        run: |
          for f in scripts/*.mjs wp-content/plugins/designinserter/assets/*.js; do
            node --check "$f"
          done

      - name: npm test (catalog + contract + stub smoke)
        run: npm test
