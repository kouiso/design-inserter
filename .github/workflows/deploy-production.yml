name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（実際にはデプロイしない）'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production-manual
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changed Targets
    runs-on: blacksmith-2vcpu-ubuntu-2204
    outputs:
      jp_changed: ${{ steps.detect.outputs.jp_changed }}
      en_changed: ${{ steps.detect.outputs.en_changed }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Find previous successful production deploy
        id: previous-success
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch,
              event: 'workflow_dispatch',
              status: 'success',
              per_page: 100,
            });
            const previous = runs.find((run) => run.name === context.workflow && run.id !== context.runId);
            core.setOutput('head_sha', previous ? previous.head_sha : '');

      - name: Detect changed themes
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          PREVIOUS_SHA="${{ steps.previous-success.outputs.head_sha }}"
          if [ -n "$PREVIOUS_SHA" ] && git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$PREVIOUS_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            BASE_SHA="$(git rev-parse HEAD^)"
          else
            BASE_SHA="$(git rev-parse HEAD)"
          fi

          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" HEAD)"
          printf '%s\n' "$CHANGED_FILES"

          JP_CHANGED=false
          EN_CHANGED=false

          if printf '%s\n' "$CHANGED_FILES" | grep -qE '^wp-content/themes/muashi/|^wp-content/plugins/musashi-inquiry-approval/'; then
            JP_CHANGED=true
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -qE '^wp-content/themes/muashi-en/|^wp-content/plugins/musashi-inquiry-approval/'; then
            EN_CHANGED=true
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -qE '^\.github/workflows/deploy|^\.github/workflows/ci\.yml$|^\.github/workflows/security-checks\.yml$|^\.github/workflows/labeler\.yml$|^\.github/workflows/pr-auto-setting\.yml$'; then
            JP_CHANGED=true
            EN_CHANGED=true
          fi

          echo "jp_changed=$JP_CHANGED" >> "$GITHUB_OUTPUT"
          echo "en_changed=$EN_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Detection summary
        shell: bash
        run: |
          {
            echo "## Deploy Targets"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Base SHA | \`${{ steps.detect.outputs.base_sha }}\` |"
            echo "| Head SHA | \`${GITHUB_SHA}\` |"
            echo "| muashi | \`${{ steps.detect.outputs.jp_changed }}\` |"
            echo "| muashi-en | \`${{ steps.detect.outputs.en_changed }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-xserver-jp:
    name: Deploy Xserver Production (JP)
    needs: detect-changes
    if: needs.detect-changes.outputs.jp_changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      server_label: 'Xserver (Production JP)'
      dry_run: ${{ inputs.dry_run || false }}
      ref: ${{ github.ref }}
      theme_dir: muashi
    secrets:
      XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
      XSERVER_PORT: ${{ secrets.XSERVER_PORT }}
      XSERVER_USER: ${{ secrets.XSERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  deploy-xserver-en:
    name: Deploy Xserver Production (EN)
    needs: detect-changes
    if: needs.detect-changes.outputs.en_changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production-en
      server_label: 'Xserver (Production EN)'
      dry_run: ${{ inputs.dry_run || false }}
      ref: ${{ github.ref }}
      theme_dir: muashi-en
    secrets:
      XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
      XSERVER_PORT: ${{ secrets.XSERVER_PORT }}
      XSERVER_USER: ${{ secrets.XSERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  deploy-wpx-jp:
    name: Deploy wpX Production (JP)
    needs: detect-changes
    if: needs.detect-changes.outputs.jp_changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: wpx-production
      server_label: 'wpX (Production JP)'
      dry_run: ${{ inputs.dry_run || false }}
      ref: ${{ github.ref }}
      theme_dir: muashi
    secrets:
      XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
      XSERVER_PORT: ${{ secrets.XSERVER_PORT }}
      XSERVER_USER: ${{ secrets.XSERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  deploy-wpx-en:
    name: Deploy wpX Production (EN)
    needs: detect-changes
    if: needs.detect-changes.outputs.en_changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: wpx-production-en
      server_label: 'wpX (Production EN)'
      dry_run: ${{ inputs.dry_run || false }}
      ref: ${{ github.ref }}
      theme_dir: muashi-en
    secrets:
      XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
      XSERVER_PORT: ${{ secrets.XSERVER_PORT }}
      XSERVER_USER: ${{ secrets.XSERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
