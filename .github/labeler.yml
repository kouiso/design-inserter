# Pull Request Labeler Configuration
# ファイルパスのパターンに基づいて自動的にラベルを付与

# WordPress コアファイル
wordpress-core:
  - changed-files:
    - any-glob-to-any-file:
      - 'wp-admin/**'
      - 'wp-includes/**'
      - '{wp-*.php,index.php}'

# テーマ関連
theme:
  - changed-files:
    - any-glob-to-any-file:
      - 'wp-content/themes/**'

# プラグイン関連
plugin:
  - changed-files:
    - any-glob-to-any-file:
      - 'wp-content/plugins/**'

# スタイル（SCSS/CSS）
styles:
  - changed-files:
    - any-glob-to-any-file:
      - 'wp-content/themes/muashi/src/scss/**'
      - 'wp-content/themes/muashi/assets/css/**'

# JavaScript
javascript:
  - changed-files:
    - any-glob-to-any-file:
      - 'wp-content/themes/muashi/src/js/**'
      - 'wp-content/themes/muashi/assets/js/**'

# GitHub Actions / CI/CD
ci-cd:
  - changed-files:
    - any-glob-to-any-file:
      - '.github/**'

# ドキュメント
documentation:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.md'
      - 'readme.html'
      - 'license.txt'
      - 'test-specs/**/*.html'

# テスト関連
test:
  - changed-files:
    - any-glob-to-any-file:
      - 'test/**'
      - 'test-specs/**'
      - 'playwright.config.ts'
      - '**/*test*.php'
      - '**/*spec*.php'

# E2Eテスト
e2e-test:
  - changed-files:
    - any-glob-to-any-file:
      - 'test/e2e/**'
      - 'playwright.config.ts'

# ツール
tools:
  - changed-files:
    - any-glob-to-any-file:
      - 'tools/**'
      - 'gulpfile.js'
      - 'package.json'

# 設定ファイル
config:
  - changed-files:
    - any-glob-to-any-file:
      - 'wp-config*.php'
      - '.gitignore'
      - '.editorconfig'
      - '.github/**/*.yml'

# AI設定
ai-config:
  - changed-files:
    - any-glob-to-any-file:
      - 'prompt/**'
      - 'CLAUDE.md'
      - '.github/copilot-instructions.md'
